name: Update PQC status

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the hour to avoid scheduler congestion)
  workflow_dispatch:

# Never run two refreshes at once (scheduled + manual).
concurrency:
  group: update-pqc-status
  cancel-in-progress: false

permissions:
  contents: write # only needed to push the generated data commit; no other scopes

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'

      - name: Tests and lint (before touching data)
        run: |
          ruff check .
          python -m pytest -q

      - name: Refresh data and regenerate README
        id: refresh
        # Exit 2 = some source failed; last-known-good data was kept and the
        # failure recorded. We still commit that state, then fail the job below.
        run: |
          set +e
          python scripts/update.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated output
        if: steps.refresh.outputs.code != '1'
        run: |
          python scripts/generate_readme.py --check
          python -c "import json; json.load(open('data/current.json'))"

      - name: Commit changes (if any)
        if: steps.refresh.outputs.code != '1'
        run: |
          if [ -z "$(git status --porcelain data README.md)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          # GITHUB_TOKEN pushes do not trigger further workflow runs, so no loop.
          git commit -m "chore: update PQC standards status [skip ci]"
          git push

      - name: Fail the job if any source failed
        if: steps.refresh.outputs.code != '0'
        run: |
          echo "::error::Updater exited with code ${{ steps.refresh.outputs.code }} (1=fatal, 2=source errors)"
          exit 1
